plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.aceinandroid.inkflow'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.aceinandroid.inkflow'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'offline'
    productFlavors {
        standard { dimension 'offline'; buildConfigField 'boolean', 'ON_DEVICE_OCR', 'false' }
        fullOcr { dimension 'offline'; buildConfigField 'boolean', 'ON_DEVICE_OCR', 'true' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main.java.srcDirs = ['src/main/kotlin']
        standard.java.srcDirs = ['src/standard/kotlin']
        fullOcr.java.srcDirs = ['src/fullOcr/kotlin']
        fullOcr.assets.srcDir layout.buildDirectory.dir('generated/fullOfflineAssets')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.24.0'
    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    fullOcrImplementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// Include only dictionary shards, never Flutter assets or the Flutter runtime.
tasks.register('prepareFullOfflineAssets', Sync) {
    from('../../assets/dictionaries/chinese') { into 'dictionaries/chinese' }
    into layout.buildDirectory.dir('generated/fullOfflineAssets')
}
tasks.configureEach { task ->
    if (task.name.startsWith('mergeFullOcr') && task.name.endsWith('Assets')) {
        task.dependsOn('prepareFullOfflineAssets')
    }
}
